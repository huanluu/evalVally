name: omr-gate-cleanup-case-002
description: Reproduce Harness case 002 as a direct Vally code-generation eval.
version: "1.0"
type: capability

defaults:
  runs: 1
  timeout: 10m
  executor: copilot-sdk
  model: gpt-5.6-sol

stimuli:
  - name: remove-optimistic-ui-change-gate
    tags:
      priority: p0
      area: gate-cleanup
    prompt: |
      Fix this bug:

      Title: [HARNESS-EVAL] Case 002: Remove ChangeGate
      IsOptimisticUIUpdateEnabled (gate_cleanup pilot)

      Description:
      This is a ChangeGateCleanup Bug, tracking cleanup of ChangeGate
      microsoft.office.docsui.documentmru.aggregatedmru.isoptimisticuiupdateenabled.

      Additional details on Why did I get this bug? and How do I resolve this bug?

      Date of gate introduction: 11/12/2025

      The first commit I found this gate in:
      572b5d4ef9e43742c78a30c8db8826b31cd4edbf

      If you are not the owner, please reassign if possible; if you need help,
      contact the DocsUI experimentation champ: chewa

      Do not inspect git history, commits, pull requests, or blame. Do not build
      or commit. Diagnose and fix the bug, then explain the result briefly.
    graders:
      - type: completed
      - type: program
        config:
          program: /bin/zsh
          args:
            - -lc
            - 'node "$EVALVALLY_ROOT/graders/validate-gate-cleanup-case-002.mjs"'
          timeout: 30s
      - type: tool-calls
        config:
          disallowed:
            - name: "^bash$"
              command: 'git\s+(?:log|show|blame|diff)'
            - "^(create|Write)$"

scoring:
  threshold: 1.0
